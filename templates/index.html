<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Database Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h1>AI Database Chatbot</h1>
        <p>Ask questions about students, subjects and marks.</p>

        <div id="chat-box" aria-live="polite">
            <div class="message bot">
                Hello! Ask me a question about your database.
            </div>
        </div>

        <form id="chat-form">
            <input
                type="text"
                id="question"
                placeholder="Ask your database..."
                required
                autocomplete="off"
            >
            <button type="submit" id="send-button">Send</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
